# 기존 nginx 의 HTTPS server { ... } 블록 안에 include 해서 사용
#   include /opt/dorandoran/deploy/nginx-dorandoran.conf;
# (setup-vps.sh --nginx 가 자동으로 넣어줍니다. 포트를 바꿨다면 18787 을 맞춰 주세요)

location /dorandoran-api/ {
    proxy_pass http://127.0.0.1:18787/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
    proxy_read_timeout 30s;
}

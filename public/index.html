<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffef79" />
  <title>도란도란 롤링페이퍼</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <!-- 편지 모달 -->
  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <article class="letter letter--modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal__close" type="button" aria-label="닫기" data-close>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
      <h2 class="letter__from" id="modal-title"></h2>
      <div class="letter__body" id="modal-body"></div>
    </article>
  </div>

  <!-- 편지 쓰기 (멘토) -->
  <div class="modal" id="editor" hidden>
    <div class="modal__backdrop" data-close></div>
    <form class="letter letter--modal letter--editor" role="dialog" aria-modal="true" aria-labelledby="editor-title" novalidate>
      <button class="modal__close" type="button" aria-label="닫기" data-close>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
      <h2 class="letter__from" id="editor-title"></h2>
      <label class="sr-only" for="editor-text">편지 내용</label>
      <textarea class="letter__body" id="editor-text" placeholder="멘티에게 하고 싶은 말을 적어 주세요."></textarea>
      <div class="editor__bar">
        <span class="editor__count" id="editor-count" aria-live="polite"></span>
        <span class="editor__msg" id="editor-msg" role="status"></span>
        <button class="pill editor__save" id="editor-save" type="submit">저장</button>
      </div>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>

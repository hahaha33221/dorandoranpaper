<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffef79" />
  <title>도란도란 롤링페이퍼</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <!-- 편지 모달 -->
  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <article class="letter letter--modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal__close" type="button" aria-label="닫기" data-close>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
      <h2 class="letter__from" id="modal-title"></h2>
      <div class="letter__body" id="modal-body"></div>
    </article>
  </div>

  <!-- 편지 쓰기 (멘토) -->
  <div class="modal" id="editor" hidden>
    <div class="modal__backdrop" data-close></div>
    <form class="letter letter--modal letter--editor" role="dialog" aria-modal="true" aria-labelledby="editor-title" novalidate>
      <button class="modal__close" type="button" aria-label="닫기" data-close>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
      <h2 class="letter__from" id="editor-title"></h2>
      <label class="sr-only" for="editor-text">편지 내용</label>
      <textarea class="letter__body" id="editor-text" placeholder="멘티에게 하고 싶은 말을 적어 주세요."></textarea>
      <div class="editor__bar">
        <span class="editor__count" id="editor-count" aria-live="polite"></span>
        <span class="editor__msg" id="editor-msg" role="status"></span>
        <button class="pill editor__save" id="editor-save" type="submit">저장</button>
      </div>
    </form>
  </div>

  <!-- 비밀번호 변경 -->
  <div class="modal" id="pwdialog" hidden>
    <div class="modal__backdrop" data-close></div>
    <form class="letter letter--modal letter--password" role="dialog" aria-modal="true" aria-labelledby="pw-title" novalidate>
      <button class="modal__close" type="button" aria-label="닫기" data-close>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
      <h2 class="letter__from" id="pw-title">비밀번호 변경</h2>
      <div class="letter__body pwbox">
        <p class="pwbox__note" id="pw-note" hidden>처음 받은 비밀번호를 쓰고 있어요.<br />나만 아는 비밀번호로 바꿔 주세요.</p>
        <label><span>지금 비밀번호</span>
          <input name="current" type="password" autocomplete="current-password" required />
        </label>
        <label><span>새 비밀번호 <small>(6자 이상)</small></span>
          <input name="next" type="password" autocomplete="new-password" minlength="6" maxlength="64" required />
        </label>
        <label><span>새 비밀번호 확인</span>
          <input name="confirm" type="password" autocomplete="new-password" required />
        </label>
        <p class="pwbox__msg" id="pw-msg" role="alert"></p>
      </div>
      <div class="editor__bar">
        <button class="linkish" id="pw-later" type="button" data-close>취소</button>
        <span class="editor__msg"></span>
        <button class="pill editor__save" id="pw-save" type="submit">바꾸기</button>
      </div>
    </form>
  </div>

  <!-- 사진 크게 보기 -->
  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="사진 보기" hidden>
    <div class="viewer__bar">
      <span class="viewer__count" id="viewer-count" aria-live="polite"></span>
      <button class="viewer__close" type="button" aria-label="닫기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
    </div>
    <div class="viewer__stage">
      <img class="viewer__img" id="viewer-img" alt="" />
    </div>
    <button class="viewer__nav viewer__prev" type="button" aria-label="이전 사진">‹</button>
    <button class="viewer__nav viewer__next" type="button" aria-label="다음 사진">›</button>
  </div>

  <!-- 확인 창 (로그아웃 등) -->
  <div class="modal" id="confirm" hidden>
    <div class="modal__backdrop"></div>
    <div class="letter letter--modal letter--confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-text">
      <h2 class="letter__from" id="confirm-title"></h2>
      <div class="letter__body confirm__body">
        <p id="confirm-text"></p>
        <div class="confirm__actions">
          <button class="pill confirm__cancel" id="confirm-cancel" type="button"></button>
          <button class="pill confirm__ok" id="confirm-ok" type="button"></button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
